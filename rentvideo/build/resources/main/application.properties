spring.application.name=rentvideo

spring.datasource.url=jdbc:mysql://localhost:3306/rentvideo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Convenient for the assignment. Use Flyway/Liquibase migrations in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# HMAC key: must be at least 32 characters. Override with the JWT_SECRET env var.
app.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-123456}
app.jwt.expiration-ms=3600000
